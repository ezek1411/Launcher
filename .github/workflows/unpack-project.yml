name: Installer les fichiers EKP-Launcher

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  unpack:
    name: Décompresser le projet
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Vérifier l’archive
        run: |
          if [ ! -f "EKP-Launcher-fichiers.zip" ]; then
            echo "Erreur : EKP-Launcher-fichiers.zip est introuvable."
            ls -la
            exit 1
          fi

      - name: Décompresser le projet
        run: |
          set -eux

          rm -rf unpacked
          mkdir -p unpacked

          unzip -o "EKP-Launcher-fichiers.zip" -d unpacked

          if [ -d "unpacked/EKP-Launcher" ]; then
            cp -R "unpacked/EKP-Launcher/." .
          else
            cp -R "unpacked/." .
          fi

          rm -rf unpacked
          rm -f "EKP-Launcher-fichiers.zip"

      - name: Ne pas copier le workflow de compilation automatiquement
        run: |
          rm -f ".github/workflows/build-windows-mod.yml"

      - name: Enregistrer les fichiers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git commit -m "Installer les fichiers EKP-Launcher" || echo "Aucun changement à enregistrer"

          git push
